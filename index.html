<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industry X | Angel Jimenez Rosario</title>
<style>
  :root { --red: #e10600; --ink: #111; --paper: #fff; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--paper); }
  .card { width: min(360px, calc(100% - 32px)); text-align: center; padding: 32px 24px; border: 2px solid var(--red);
          border-radius: 16px; }
  .brand { font-weight: 900; letter-spacing: .08em; font-size: 28px; margin: 0 0 4px; }
  .brand span { color: var(--red); }
  .name { font-size: 20px; margin: 20px 0 4px; }
  .num { font-size: 26px; font-weight: 700; margin: 0 0 24px; }
  a.btn { display: block; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 18px; text-decoration: none;
          margin-top: 12px; }
  .add { background: var(--red); color: var(--paper); }
  .call { border: 2px solid var(--paper); color: var(--paper); }
  .note { opacity: .7; font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">INDUSTRY <span>X</span></p>
    <p class="name">Angel Jimenez Rosario</p>
    <p class="num">(321) 443-8283</p>
    <a class="btn add" href="angel.vcf">Add to Contacts</a>
    <a class="btn call" href="tel:+13214438283">Call</a>
    <p class="note">Zelle: send to (321) 443-8283</p>
  </div>
</body>
</html>
